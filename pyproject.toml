[build-system]
requires = [
    "hatchling==1.31.0",
    "packaging==26.2",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "trove-classifiers==2026.6.1.19",
]
build-backend = "hatchling.build"

[project]
name = "a0"
version = "2.6"
description = "Terminal chat interface for Agent Zero"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "agent0ai" },
]
keywords = ["agent-zero", "a0", "cli", "textual", "tui"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals",
]
dependencies = [
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.3",
    "aiohttp-jinja2==1.6",
    "aiosignal==1.4.0",
    "anyio==4.14.2",
    "attrs==26.1.0",
    "bidict==0.23.1",
    "certifi==2026.7.22",
    "comtypes==1.4.16 ; sys_platform == 'win32'",
    "dxcam==0.3.0 ; sys_platform == 'win32'",
    "frozenlist==1.8.0",
    "greenlet==3.5.4",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.18",
    "jinja2==3.1.6",
    "linkify-it-py==2.1.0",
    "markdown-it-py==4.2.0",
    "markupsafe==3.0.3",
    "mdit-py-plugins==0.6.1",
    "mdurl==0.1.2",
    "multidict==6.7.1",
    "numpy==2.5.1 ; sys_platform == 'win32'",
    "pillow==12.3.0 ; sys_platform == 'darwin' or sys_platform == 'win32'",
    "platformdirs==4.11.0",
    "playwright==1.61.0",
    "propcache==0.5.2",
    "pyee==13.0.1",
    "pygments==2.20.0",
    "pyobjc-core==12.2.1 ; sys_platform == 'darwin'",
    "pyobjc-framework-applicationservices==12.2.1 ; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa==12.2.1 ; sys_platform == 'darwin'",
    "pyobjc-framework-coretext==12.2.1 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz==12.2.1 ; sys_platform == 'darwin'",
    "python-engineio==4.13.3",
    "python-socketio==5.16.3",
    "pywin32==312 ; sys_platform == 'win32'",
    "pywinauto==0.6.9 ; sys_platform == 'win32'",
    "rich==15.0.0",
    "simple-websocket==1.1.0",
    "six==1.17.0 ; sys_platform == 'win32'",
    "textual==8.2.8",
    "textual-serve==1.1.3",
    "typing-extensions==4.16.0",
    "uc-micro-py==2.0.0",
    "wsproto==1.3.2",
    "yarl==1.24.5",
]

[project.urls]
Homepage = "https://github.com/agent0ai/a0-connector"
Repository = "https://github.com/agent0ai/a0-connector"
Issues = "https://github.com/agent0ai/a0-connector/issues"

[project.scripts]
a0 = "agent_zero_cli.__main__:main"

[project.entry-points."a0.computer_use_backends"]
wayland = "a0_computer_use_wayland.backend:WAYLAND_BACKEND_SPEC"
macos = "a0_computer_use_macos.backend:MACOS_BACKEND_SPEC"
windows = "a0_computer_use_windows.backend:WINDOWS_BACKEND_SPEC"

[tool.hatch.build.targets.wheel]
packages = [
    "src/agent_zero_cli",
    "packages/a0-computer-use-wayland/src/a0_computer_use_wayland",
    "packages/a0-computer-use-macos/src/a0_computer_use_macos",
    "packages/a0-computer-use-windows/src/a0_computer_use_windows",
]

[tool.pytest.ini_options]
markers = [
    "large_payload_soak: opt-in 16-64 MiB connector transport soak",
]
