[package]
name = "a0-browser-bridge"
version = "2.12.3"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Standalone Agent Zero Chromium native-messaging companion"
publish = false

[features]
default = []
local-development = []

[lib]
name = "a0_browser_bridge"
path = "src/lib.rs"

[[bin]]
name = "a0-browser-bridge"
path = "src/main.rs"

[dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
flate2 = { version = "=1.1.5", default-features = false, features = ["rust_backend"] }
getrandom = "=0.4.3"
ureq = { version = "=3.4.0", default-features = false, features = ["platform-verifier", "rustls"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["std"] }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.0"
sha2 = "=0.11.0"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
